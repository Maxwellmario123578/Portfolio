<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="60" y="92" fill="#f8fafc" font-size="54" font-weight="700">Nkulex</text>
  <text x="60" y="134" fill="#cbd5e1" font-size="24">Assistant juridique OHADA · RAG hybride sur ~3 100 décisions</text>

  <g font-size="20" text-anchor="middle">
    <!-- Frontend -->
    <rect x="60" y="250" width="200" height="110" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="160" y="295" fill="#f8fafc" font-weight="600">Frontend</text>
    <text x="160" y="325" fill="#94a3b8" font-size="17">Angular 21 · SSE</text>

    <!-- BFF -->
    <rect x="340" y="250" width="200" height="110" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="440" y="295" fill="#f8fafc" font-weight="600">Backend BFF</text>
    <text x="440" y="325" fill="#94a3b8" font-size="17">FastAPI · JWT</text>

    <!-- Postgres -->
    <rect x="340" y="440" width="200" height="90" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="440" y="480" fill="#f8fafc" font-weight="600">PostgreSQL</text>
    <text x="440" y="508" fill="#94a3b8" font-size="17">historique</text>

    <!-- ML -->
    <rect x="620" y="230" width="240" height="150" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="740" y="275" fill="#f8fafc" font-weight="600">Service ML (RAG)</text>
    <text x="740" y="305" fill="#94a3b8" font-size="17">MiniLM multilingue</text>
    <text x="740" y="330" fill="#94a3b8" font-size="17">dense + BM25 + lexical</text>
    <text x="740" y="355" fill="#94a3b8" font-size="17">anti-hallucination</text>

    <!-- Chroma -->
    <rect x="940" y="200" width="200" height="90" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="1040" y="240" fill="#f8fafc" font-weight="600">ChromaDB</text>
    <text x="1040" y="268" fill="#94a3b8" font-size="17">+ index BM25</text>

    <!-- Mistral -->
    <rect x="940" y="330" width="200" height="90" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="1040" y="370" fill="#f8fafc" font-weight="600">Mistral API</text>
    <text x="1040" y="398" fill="#94a3b8" font-size="17">streaming</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <line x1="262" y1="305" x2="336" y2="305"/>
    <line x1="542" y1="305" x2="616" y2="305"/>
    <line x1="440" y1="362" x2="440" y2="436"/>
    <line x1="862" y1="280" x2="936" y2="250"/>
    <line x1="862" y1="330" x2="936" y2="370"/>
  </g>

  <text x="60" y="615" fill="#64748b" font-size="18">Docker Compose · nginx · CI/CD GitHub Actions · nkulex.com</text>
</svg>
